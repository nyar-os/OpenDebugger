[workspace]
resolver = "2"
members = ["crates/core", "crates/napi"]
default-members = ["crates/core", "crates/napi"]

[profile.release]
lto = true
panic = "abort"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nyar-os/OpenDebugger"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open-debugger-core = { path = "crates/core" }
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "78976acad7a63fcb8f7cc0f1ba7575c0bc78a10f" }
